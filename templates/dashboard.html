<!-- The form must wrap BOTH the table containing the checkboxes AND the submit buttons -->
<form action="{{ url_for('admin_borrow_action') }}" method="POST">
    
    <table class="table">
        <thead>
            <tr>
                <th>Select</th>
                <th>User</th>
                <th>Item</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            {% for req in pending_borrows %}
            <tr>
                <td>
                    <!-- The checkbox name must match what the backend looks for (e.g., loan_id or loan_ids) -->
                    <input type="checkbox" name="loan_id" value="{{ req.loan_id }}">
                </td>
                <td>{{ req.username }}</td>
                <td>{{ req.item_name }}</td>
                <td>{{ req.quantity }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- The buttons must be INSIDE the same <form> tag -->
    <div class="actions">
        <button type="submit" name="action" value="approve" class="btn btn-success">Approve Selected</button>
        <button type="submit" name="action" value="reject" class="btn btn-danger">Reject Selected</button>
    </div>

</form>
